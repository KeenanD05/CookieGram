<!DOCTYPE html>
<html>
<head>
    <title>Payment Cancelled</title>
    <style>
        .container {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .cancel-icon {
            color: #f44336;
            font-size: 48px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 10px;
        }
        .btn-cancel {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cancel-icon">✕</div>
        <h1>Payment Cancelled</h1>
        <p>Your payment was not completed.</p>
        <p>If this was a mistake, you can try again.</p>
        <a href="/payments/checkout" class="btn">Try Again</a>
        <a href="/" class="btn btn-cancel">Return to Home</a>
    </div>
</body>
</html>
