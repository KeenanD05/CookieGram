<div class="login-page">
  <h2>Login to CookieGram</h2>

  <form (ngSubmit)="submit()">
    <input [(ngModel)]="username" name="username" type="text" placeholder="Username" required />
    <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required />
    <button type="submit">Login</button>

    <!-- Added Forgot Password link -->
    <p class="forgot-password" (click)="onForgotPassword()">Forgot Password?</p>
  </form>

  <button class="back-btn" routerLink="/">← Back to Home</button>
</div>
