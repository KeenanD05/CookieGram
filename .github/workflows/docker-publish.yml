name: CI/CD CookieGram

on:
  push:
    branches: ["sprint-3-order-status"] # Triggers on push to your new branch
  pull_request:
    branches: ["sprint-3-order-status"]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TEST & BUILD BACKEND (JAVA)
  # ------------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # We verify the app compiles and packages correctly before trying to Dockerize
      - name: Build with Maven
        run: mvn -B package -DskipTests --file backendSprint3Final/pom.xml

  # ------------------------------------------------------------------
  # JOB 2: TEST & BUILD FRONTEND (ANGULAR)
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: cookiegram-frontendSprint3/package-lock.json

      - name: Install Dependencies
        working-directory: ./cookiegram-frontendSprint3
        run: npm ci

      - name: Build Angular App
        working-directory: ./cookiegram-frontendSprint3
        run: npm run build --configuration=production

  # ------------------------------------------------------------------
  # JOB 3: DOCKER BUILD & PUSH
  # ------------------------------------------------------------------
  docker-push:
    needs: [build-backend, build-frontend] # Only runs if tests/builds pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------
      # BUILD & PUSH BACKEND
      # --------------------------------------
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          # Point to your specific backend folder
          context: ./backendSprint3Final
          file: ./backendSprint3Final/Dockerfile
          push: true
          # Change 'cookiegram-backend' to your preferred image name
          tags: ${{ secrets.DOCKER_USERNAME }}/cookiegram-backend:latest

      # --------------------------------------
      # BUILD & PUSH FRONTEND
      # --------------------------------------
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          # Point to your specific frontend folder
          context: ./cookiegram-frontendSprint3
          file: ./cookiegram-frontendSprint3/Dockerfile
          push: true
          # Change 'cookiegram-frontend' to your preferred image name
          tags: ${{ secrets.DOCKER_USERNAME }}/cookiegram-frontend:latest
