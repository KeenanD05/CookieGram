name: Continuous Integration

on:
  push:
    branches: [ "sprint-3-order-status", "staging", "main" ]
  pull_request:
    branches: [ "sprint-3-order-status", "staging", "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Start services with Docker Compose
      run: |
        docker compose -f compose.yml up -d
        docker compose -f compose.yml ps

    - name: Wait for backend to be ready
      run: |
        for i in {1..30}; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$CODE" != "000" ]; then
            echo "Backend is up with status $CODE"
            exit 0
          fi
          echo "Waiting for backend..."
          sleep 2
        done
        echo "Backend did not start in time"
        docker compose -f compose.yml logs backend --tail=200
        exit 1

    - name: Run Backend Tests
      run: mvn test --file backendSprint3Final/pom.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: cookiegram-frontendSprint3/package-lock.json

    - name: Install Dependencies
      working-directory: ./cookiegram-frontendSprint3
      run: npm ci

    - name: Build Frontend
      working-directory: ./cookiegram-frontendSprint3
      run: npm run build --configuration=production
