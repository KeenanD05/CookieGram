spring.application.name=backend

# =================================================
# DATABASE CONFIGURATION (MySQL)
# =================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cookiegramdb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================================
# JPA / HIBERNATE SETTINGS
# =================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Fixes the "SEQUENCES" table error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =================================================
# APP CONFIG
# =================================================
app.jwtSecret=yourJWTSecretKeyShouldBeLongAndSecureAtLeast64CharactersLong123456789077dhbvnshy46bdhhdtettyeybdfdfhnnm
app.jwtExpirationMs=86400000
app.jwtCookieName=auth_cookie

# =================================================
# EMAIL CONFIGURATION (CRITICAL FIX)
# =================================================
# These MUST NOT be commented out with '#'
email.sender=devsagwal96@gmail.com
email.sender.name=CookieGram

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=devsagwal96@gmail.com
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# =================================================
# STRIPE
# =================================================
stripe.api.key=${STRIPE_API_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.currency=${STRIPE_CURRENCY:cad}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# =================================================
# PAGINATION
# =================================================
pagination.default-page=0
pagination.default-size=10
pagination.default-sort-by=id
pagination.default-sort-direction=asc
