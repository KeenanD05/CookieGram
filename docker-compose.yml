version: '3.8'

services:
  # ---------------------------------
  # 1. DATABASE (MySQL)
  # ---------------------------------
  mysqldb:
    image: mysql:8.0
    container_name: cookiegram-db
    restart: always
    environment:
      MYSQL_DATABASE: cookiegramdb
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cookieuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cookiegram-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ---------------------------------
  # 2. BACKEND (Spring Boot)
  # ---------------------------------
  backend:
    # UPDATED PATH to match your folder name
    build: ./backendSprint3Final
    container_name: cookiegram-backend
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Connect to the 'mysqldb' container
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/cookiegramdb?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=cookieuser
      - SPRING_DATASOURCE_PASSWORD=password
      
      # Secrets from your .env file
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      
      # CORS settings
      - ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80,http://localhost
    networks:
      - cookiegram-net

  # ---------------------------------
  # 3. FRONTEND (Angular + Nginx)
  # ---------------------------------
  frontend:
    # UPDATED PATH to match your folder name
    build: ./cookiegram-frontendSprint3
    container_name: cookiegram-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - cookiegram-net

volumes:
  db_data:

networks:
  cookiegram-net:
    driver: bridge